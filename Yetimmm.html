/* ═════════════ 7) TRADING RULES + ENGINE (sim mode) ═════════════ */
function lotFor(risk,entry,sl){
  const d=Math.abs(entry-sl);if(d<1e-9)return{e:t("e_lot0")};
  const lot=r2(Math.floor(risk/(d*C)/STEP+1e-7)*STEP);
  if(lot<VMIN-1e-9)return{e:t("e_lotMin",VMIN)};
  if(lot>VMAX)return{e:t("e_lotMax")};
  return{lot,est:lot*d*C};
}
function vLevels(b,s){if(!(b>0&&s>0))return t("e_pos");if(b<=s)return t("e_ord");return""}
const placeErr=(b,s)=>b<=S.price?t("e_buyP"):s>=S.price?t("e_sellP"):"";
const nextRisk=L=>r2((L+S.target)/S.rr);
const floating=()=>{const x=S.pos;return x?(x.side==="BUY"?S.price-x.entry:x.entry-S.price)*x.lot*C:0};
function openPos(side,entry){
  const b=side==="BUY",sl=b?S.sell:S.buy,d=Math.abs(entry-sl),L=lotFor(S.cur,entry,sl);
  if(L.e){S.state="ERROR";S.msg=L.e;return}
  S.pos={side,entry:r2(entry),sl,tp:r2(b?entry+d*S.rr:entry-d*S.rr),lot:L.lot,est:L.est,risk:S.cur,no:++S.no};
  S.state=b?"BUY_ACTIVE":"SELL_ACTIVE";S.msg="";toast(t("t_exec",t(b?"t_ob":"t_os"),f(entry)));Bus.emit("open",S.pos);
}
function closeTrade(reason,exit){
  const p=S.pos;if(!p)return 0;
  const pnl=(p.side==="BUY"?exit-p.entry:p.entry-exit)*p.lot*C;
  S.hist.unshift({no:p.no,side:p.side,entry:p.entry,exit:r2(exit),lot:p.lot,pnl,reason,t:new Date().toLocaleTimeString("en-GB")});
  S.hist=S.hist.slice(0,100);S.pos=null;Bus.emit("close",S.hist[0]);return pnl;
}
function engine(){
  const p=S.price,x=S.pos;
  if(S.state==="ARMED"){if(p>=S.buy)openPos("BUY",S.buy);else if(p<=S.sell)openPos("SELL",S.sell)}
  else if(S.state==="WAITING_REENTRY"){if(p<S.buy&&p>S.sell)S.state="ARMED"}
  else if(x){
    const b=x.side==="BUY";
    if(b?p<=x.sl:p>=x.sl){
      const pnl=closeTrade("SL",x.sl);S.acc=r2(S.acc-pnl);S.seq++;S.cur=nextRisk(S.acc);S.state="WAITING_REENTRY";
      toast(t("t_sl",sg(pnl),f(S.cur)));
      if(S.breach==="MARKET")openPos(b?"SELL":"BUY",S.price);
    }else if(b?p>=x.tp:p<=x.tp){
      const pnl=closeTrade("TP",x.tp);S.acc=0;S.seq=0;S.cur=S.risk;toast(t("t_tp",sg(pnl)));
      if(S.pend){S.buy=S.pend.buy;S.sell=S.pend.sell;S.risk=S.pend.risk;if(S.pend.rr)S.rr=S.pend.rr;if(S.pend.target!=null)S.target=S.pend.target;S.cur=S.risk;S.pend=null;S.state="ARMED"}else S.state="TP_RESET";
    }
  }
}

/* ═════════════ 8) ACTIONS — single entry point: run(cmd, params) ═════════════ */
const ACT={
  start(){S.acc=0;S.seq=0;S.cur=S.risk;S.run=true;S.state="ARMED";S.msg="";Bus.emit("start");toast(t("t_start"))},
  stop(){if(S.pos)closeTrade("MANUAL",S.price);S.run=false;S.state="STOPPED";S.pos=null;S.pend=null;S.msg="";Bus.emit("stop");toast(t("t_stop"))},
  close(){closeTrade("MANUAL",S.price);S.state="IDLE"},
  apply(p){
    if(S.pos){S.pend={buy:p.buy,sell:p.sell,risk:p.risk,target:p.target,rr:p.rr};toast(t("t_pend"))}
    else{S.buy=p.buy;S.sell=p.sell;S.risk=p.risk;S.target=p.target;S.rr=p.rr;S.cur=S.acc>0?nextRisk(S.acc):p.risk;if(S.run&&(S.state==="TP_RESET"||S.state==="IDLE"))S.state="ARMED";toast(t("t_applied"))}
  },
  reset(){if(S.pos)return toast(t("t_noReset"));S.acc=0;S.seq=0;S.cur=S.risk;toast(t("t_reset"))}
};
function run(c,p={}){
  Bus.emit("cmd",{cmd:c,...p});vib();
  if(live())return Bridge.cmd(c,p);
  if(ACT[c])ACT[c](p);save();render();
}

function ask(ti,b,y,fn){$("sheet").innerHTML=`<b>${ti}</b><p>${b}</p><div class="btns"><button class="btn" id="no">${t("back")}</button><button class="btn dg" id="yes">${y}</button></div>`;$("no").onclick=shut;$("yes").onclick=()=>{shut();fn()};$("ov").classList.add("show")}
const shut=()=>$("ov").classList.remove("show");$("ov").onclick=e=>{if(e.target.id==="ov")shut()};
const stIc={STOPPED:"pause",IDLE:"clock",TP_RESET:"target",ARMED:"bolt",BUY_ACTIVE:"up",SELL_ACTIVE:"dn",WAITING_REENTRY:"clock",ERROR:"alert"};
const stDot={STOPPED:"gd",IDLE:"gd",TP_RESET:"gd",ARMED:"up",BUY_ACTIVE:"up",SELL_ACTIVE:"dn",WAITING_REENTRY:"gd",ERROR:"dn"};

function start(){const e=vLevels(S.buy,S.sell)||placeErr(S.buy,S.sell)||lotFor(S.risk,S.buy,S.sell).e;if(e)return toast(t("t_startF",e));run("start")}
function stop(){S.pos?ask(t("q_open"),t("q_openB",sg(floating())),t("q_openY"),()=>run("stop")):run("stop")}
function closePos(){ask(t("q_close"),t("q_closeB",sg(floating())),t("q_close"),()=>run("close"))}
function applyLevels(){
  const b=num($("in_b").value),s=num($("in_s").value),r=num($("in_r").value),tg=num($("in_t").value),rr=num($("in_rr").value);
  let e=vLevels(b,s)||(r>0?"":t("e_risk"))||(tg<0?t("e_tneg"):"")||(rr>0?"":t("e_rr"))||lotFor(r,b,s).e||"";
  if(!e&&S.state==="ARMED"&&!S.pos)e=placeErr(b,s);
  if(e)return toast("❌ "+e);
  run("apply",{buy:b,sell:s,risk:r,target:tg,rr});
}

function renderDash(){
  const x=S.pos,k=(l,v,c="")=>`<div><small>${l}</small><b class="num ${c}">${v}</b></div>`;
  let h=`<div class="card"><div class="state"><div class="sico ${stDot[S.state]||"gd"}">${ic(stIc[S.state]||"pause")}</div><div><b>${t("st_"+S.state)}</b><small>${S.msg||t("sx_"+S.state)}</small></div></div><div class="btns">`;
  h+=S.run?`<button class="btn dg ${x?"":"w"}" onclick="stop()">${ic("stop")}${t("stopB")}</button>`:`<button class="btn go w" onclick="start()">${ic("play")}${t("startB")}</button>`;
  if(x)h+=`<button class="btn" onclick="closePos()">${ic("xc")}${t("closeB")}</button>`;
  h+=`</div></div>`;
  if(x){
    const b=x.side==="BUY",fl=floating(),lo=b?x.sl:x.tp,hi=b?x.tp:x.sl,pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)),z=pc(x.entry);
    const bg=b?`linear-gradient(90deg,var(--dn) ${z}%,var(--up) ${z}%)`:`linear-gradient(90deg,var(--up) ${z}%,var(--dn) ${z}%)`;
    h+=`<div class="card" style="background:linear-gradient(160deg,color-mix(in srgb,var(--${cl(fl)}) 9%,var(--surf)),var(--surf))"><div class="tk"><span class="badge ${b?"up":"dn"}">${ic(b?"up":"dn")}${t(b?"buy":"sell")}</span><span class="mu num">#${x.no}</span></div><div class="mu" style="font-size:12px">${t("flt")}</div><div class="big num ${cl(fl)}">${sg(fl)}$</div>
    <div class="pb" dir="ltr" style="background:${bg}"><u style="left:${pc(S.price)}%"></u></div><div class="pl" dir="ltr"><span>${t(b?"slS":"tpS")}</span><span>${t(b?"tpS":"slS")}</span></div>
    <div class="kv">${k(t("entry"),f(x.entry))}${k(t("slK"),f(x.sl),"dn")}${k(t("tpK"),f(x.tp),"up")}${k(t("lot"),f(x.lot))}${k(t("riskK"),"$"+f(x.risk))}${k(t("expK"),"$"+f(x.est*S.rr),"up")}</div></div>`;
  }
  const L=lotFor(S.cur,S.buy,S.sell);
  h+=`<div class="card"><h3><span class="hl">${ic("shield")}${t("rmT")}</span><span style="display:flex;gap:8px;align-items:center"><span class="num">${t("seq",S.seq+1)}</span><button class="ib" style="width:30px;height:30px" aria-label="${t("reset")}" onclick="resetUI()">${ic("refresh")}</button></span></h3><div class="kv">${k(t("curR"),"$"+f(S.cur),"gd")}${k(t("accL"),"$"+f(S.acc),S.acc>0?"dn":"")}${k(t("lot"),L.e?"—":f(x?x.lot:L.lot))}</div></div>`;
  $("dash").innerHTML=h;
}
function renderHist(){
  const H=S.hist,net=H.reduce((a,x)=>a+x.pnl,0),w=H.filter(x=>x.pnl>0).length,k=(l,v,c="")=>`<div><small>${l}</small><b class="num ${c}">${v}</b></div>`;
  $("hist").innerHTML=`<div class="card"><h3><span class="hl">${ic("dollar")}${t("net")}</span></h3><div class="big num ${cl(net)}" style="margin-bottom:12px">${sg(net)}$</div><div class="kv">${k(t("tot"),H.length)}${k(t("win"),w,"up")}${k(t("rate"),(H.length?f(w/H.length*100,0):0)+"%")}</div></div><div class="card"><h3><span class="hl">${ic("hist")}${t("logT")}</span></h3>`+(H.length?H.slice(0,40).map(x=>`<div class="hi"><div class="hl2"><i class="hs ${x.side==="BUY"?"up":"dn"}">${ic(x.side==="BUY"?"up":"dn")}</i><div><b>#${x.no} ${t(x.side==="BUY"?"buyW":"sellW")} · ${t("r_"+x.reason)}</b><small class="num">${f(x.entry)} → ${f(x.exit)} · ${f(x.lot)} ${t("lots")}</small></div></div><b class="p num ${cl(x.pnl)}">${sg(x.pnl)}$</b></div>`).join(""):`<div class="empty">${ic("hist")}<br>${t("none")}</div>`)+`</div>`;
}
function feed(){SP.push(S.price);if(SP.length>40)SP.shift()}
function renderPrice(){
  const d=S.price-prev;$("pr").textContent=f(S.price);$("pr").className="pr num "+(d>0?"up":d<0?"dn":"");$("chg").textContent=sg(d);$("chg").className="chg num "+cl(d);
  $("dB").textContent=f(S.buy-S.price);$("dS").textContent=f(S.price-S.sell);$("rng").textContent=f(S.buy-S.sell);
  if(SP.length>1){const mn=Math.min(...SP),mx=Math.max(...SP),sp=mx-mn||1;const pts=SP.map((v,i)=>(i*200/(SP.length-1)).toFixed(1)+","+(36-(v-mn)/sp*32).toFixed(1)).join(" ");$("spl").setAttribute("points",pts);$("spa").setAttribute("points",pts+" 200,40 0,40")}
}
function render(){renderPrice();renderDash();if(tab===1)renderHist()}

/* order form */
$("t0").addEventListener("click",e=>{
  const n=e.target.dataset.n;
  if(n){vib();const k=n[0]==="b"?"in_b":"in_s";$(k).value=r2(num($(k).value)+parseFloat(n.slice(1)));prevCalc()}
});
["in_b","in_s","in_r","in_t","in_rr"].forEach(i=>{$(i).addEventListener("input",prevCalc);$(i).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyLevels()}})});
/* auto stops: Buy Stop's SL = Sell Stop price · Sell Stop's SL = Buy Stop price */
function autoSL(b,s,ok,rr){
  const d=b-s,row=(sl,tp)=>`<span>${t("aSL")}: <b class="num dn">${f(sl)}</b></span><span>${t("aTP")}: <b class="num up">${f(tp)}</b></span>`;
  $("aB").innerHTML=ok?row(s,b+d*rr):"";
  $("aS").innerHTML=ok?row(b,s-d*rr):"";
}
function prevCalc(){
  const b=num($("in_b").value),s=num($("in_s").value),r=num($("in_r").value),e=vLevels(b,s),p=$("prev"),rr=num($("in_rr").value)||S.rr;
  autoSL(b,s,!e,rr);
  if(e){p.className="note er";p.textContent=e;return}
  const L=lotFor(r,b,s);p.className="note"+(L.e?" er":"");
  p.textContent=L.e||t("pv",f(L.lot),f(L.est),f(L.est*rr))+(S.pos?t("pvA"):"");
}
$("applyB").onclick=applyLevels;

function resetUI(){ask(t("q_reset"),t("q_resetB",f(S.risk)),t("q_resetY"),()=>run("reset"))}

/* shell: tabs, theme, language */
$("nav").onclick=e=>{const b=e.target.closest("button"),i=b&&b.dataset.k;if(i===undefined)return;vib();tab=+i;document.querySelectorAll(".tab").forEach((x,j)=>x.classList.toggle("on",j===tab));[...$("nav").children].forEach((c,j)=>c.classList.toggle("on",j===tab));if(tab===1)renderHist();window.scrollTo(0,0)};
function setMode(){
  const off=live()&&Bridge.ok===false;$("mode").classList.toggle("off",off);
  $("lvT").textContent=live()?"LIVE":"SIM";$("modeT").textContent=t(off?"offl":live()?"live":"demo");
}
function setTheme(v){
  v=v==="light"?"light":"dark";document.documentElement.dataset.theme=v;
  $("tc").content=v==="light"?"#f4f1e8":"#070b0a";UI.th=v;saveUI();
}
function setLang(v){
  LG=v?1:0;UI.lg=LG;saveUI();
  document.documentElement.lang=LG?"en":"ar";document.documentElement.dir=LG?"ltr":"rtl";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("lgB").textContent=LG?"ع":"EN";
  setMode();prevCalc();render();
}
$("thB").onclick=()=>{vib();setTheme(document.documentElement.dataset.theme==="light"?"dark":"light")};
$("lgB").onclick=()=>{vib();setLang(LG?0:1)};

/* ═════════════ 10) PUBLIC API — for bots, Telegram Mini App, iframes ═════════════ */
window.YetimmmAPI={
  config:CONFIG,
  on:(e,fn)=>Bus.on(e,fn),
  getState:()=>JSON.parse(JSON.stringify(S)),
  command:run,                                           // run("start") · run("apply",{buy,sell,risk}) ...
  setPrice(p){prev=S.price;S.price=+p;feed();if(!live())engine();render()},   // external price feed (MT5 / WebSocket)
  patch(o){Object.assign(S,o);render()},
  setLang:v=>setLang(v==="en"||v===1),
  setTheme
};
window.addEventListener("message",e=>{
  if(!CONFIG.origins.includes(e.origin)||!e.data||!e.data.yetimmm)return;
  const d=e.data;if(d.cmd)run(d.cmd,d.params||{});if(d.price)YetimmmAPI.setPrice(d.price);
});

/* ═════════════ 11) INIT ═════════════ */
let sig=S.state+S.no+S.hist.length;
function tick(){prev=S.price;S.price=Math.max(100,r2(S.price+(Math.random()-.5)*.8));feed();engine();const s=S.state+S.no+S.hist.length;if(s!==sig){sig=s;save();Bus.emit("state",S.state)}render()}
window.addEventListener("load",()=>TG.init());
setTheme(UI.th||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("in_b").value=S.buy;$("in_s").value=S.sell;$("in_r").value=S.risk;$("in_t").value=S.target;$("in_rr").value=S.rr;
setLang(UI.lg||0);
if(live()){Bridge.pull();setInterval(()=>Bridge.pull(),CONFIG.api.pollMs)}else setInterval(tick,1200);
</script>
</body>
</html>
